steps:
  build:
    image: node:20-alpine
    when:
      event: manual
    commands:
      - npm ci
      - npm run build
      - npm test || true

  build-pr-develop:
    image: node:20-alpine
    when:
      branch: develop
      event: pull_request
    commands:
      - npm ci
      - npm run build
      - npm test

  build-production:
    image: node:20-alpine
    when:
      branch: master
      event: tag
      ref: 'refs/tags/v*'
    commands:
      - npm ci
      - npm run build
      - npm test

  npm-publish:
    image: node:20-alpine
    when:
      event: manual
    pull_secrets: true
    commands:
      - npm ci
      - npm run build
      - echo "Debug: NPM_TOKEN length is ${#NPM_TOKEN}"
      - echo "@devpuccino:registry=https://registry.npmjs.org/" > ~/.npmrc
      - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
      - cat ~/.npmrc
      - npm publish --access public

