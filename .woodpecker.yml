steps:
  build:
    image: node:20-alpine
    when:
      event: manual
    commands:
      - npm ci
      - npm run build
      - npm test || true

  build-pr-develop:
    image: node:20-alpine
    when:
      branch: develop
      event: pull_request
    commands:
      - npm ci
      - npm run build
      - npm test

  build-production:
    image: node:20-alpine
    when:
      branch: master
      event: tag
      ref: refs/tags/v*
    commands:
      - npm ci
      - npm run build
      - npm test

  npm-publish:
    image: node:20-alpine
    when:
      event: manual
    environment:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_TOKEN:
        from_secret: NPM_TOKEN
    commands:
      - npm ci
      - npm run build
      - echo "@devpuccino:registry=https://registry.npmjs.org/" >> ~/.npmrc
      - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
      - npm publish --access public
